[project]
name = "ra"
version = "0.1.0"
description = "Simple and efficient data cleaning pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.9.0",
]

[project.scripts]
ra = "ra:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ra"]